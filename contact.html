<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mohammad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.32/dist/lenis.min.js"></script>
</head>
<body>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <header class="header" id="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">M.</a>
            <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="ph ph-list"></i></button>
            <nav class="nav-links" id="nav-links">
                <a href="index.html" data-i18n="nav.home">Home</a>
                <a href="services.html" data-i18n="nav.services">Services</a>
                <a href="portfolio.html" data-i18n="nav.portfolio">Portfolio</a>
                <a href="about.html" data-i18n="nav.about">About</a>
                <a href="contact.html" data-i18n="nav.contact" style="color:var(--primary)">Contact</a>
                <a href="where-to-find-me.html" data-i18n="nav.findMe">Where to Find Me</a>
            </nav>
            <div class="nav-controls">
                <button id="theme-toggle" class="icon-btn"><i class="ph ph-moon"></i></button>
                <button class="icon-btn lang-switch">AR</button>
            </div>
        </div>
    </header>

    <section class="section pt-150">
        <div class="bg-gradient-1" style="top:50%; left:50%; transform:translate(-50%, -50%);"></div>
        <div class="container">
            <div class="section-header text-center gsap-reveal" style="align-items:center; text-align:center;">
                <h1 class="title-lg"><span data-i18n="contact.title">Contact </span><span style="color:var(--primary)" data-i18n="contact.titleSpan">Me</span></h1>
                <p data-i18n="contact.subtitle">You can contact me via the form below or directly via my platforms.</p>
            </div>

            <div class="contact-wrapper glass-panel gsap-reveal">
                <form action="https://formspree.io/f/mqakjvzj" method="POST" class="contact-form" id="contact-form">
                    <div class="form-group">
                        <input type="text" name="name" data-i18n="contact.name" placeholder="Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" data-i18n="contact.email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <textarea name="message" data-i18n="contact.message" placeholder="Your Message..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" data-i18n="contact.send" style="width: 100%; border:none;">Send Message</button>
                </form>
            </div>
            
            <div class="social-links-lg mt-8 gsap-reveal text-center">
                <a href="mailto:qaseemmohammad60@gmail.com" class="icon-btn-lg"><i class="ph ph-envelope-simple"></i></a>
                <a href="https://iwtsp.com/963983769230" target="_blank" class="icon-btn-lg"><i class="ph ph-whatsapp-logo"></i></a>
                <a href="https://t.me/mo_a_kashreef" target="_blank" class="icon-btn-lg"><i class="ph ph-telegram-logo"></i></a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p data-i18n="footer.rights">All Rights Reserved © 2025 Mohammad Abu Khashrif - Code Evolution</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/translations.js?v=2"></script>
    <script src="js/i18n.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('contact-form');
            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    const formData = new FormData(form);
                    const actionUrl = form.getAttribute('action');
                    const submitBtn = form.querySelector('button[type="submit"]');
                    const lang = localStorage.getItem('lang') || 'en';
                    
                    const originalText = submitBtn.textContent;
                    submitBtn.textContent = lang === 'en' ? translations.en.contact.sending : translations.ar.contact.sending;
                    submitBtn.disabled = true;

                    // Fallback mailto for dual-email requirement
                    const name = form.querySelector('[name="name"]').value;
                    const email = form.querySelector('[name="email"]').value;
                    const body = form.querySelector('[name="message"]').value;
                    
                    // Fallback mailto trigger function
                    const triggerMailto = () => {
                        window.location.href = `mailto:qaseemmohammad60@gmail.com,contact@code-elta6ur.com?subject=Message from Portfolio (from ${name})&body=${encodeURIComponent('Name: ' + name + '\nEmail: ' + email + '\n\nMessage:\n' + body)}`;
                    };
                    
                    // If running locally (file://, localhost, 127.0.0.1) formspree will block it
                    const isLocal = window.location.protocol === 'file:' || window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
                    
                    if (isLocal) {
                        triggerMailto();
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                        return;
                    }
                    
                    // The primary form submission
                    fetch(actionUrl, {
                        method: 'POST',
                        body: formData,
                        headers: { 'Accept': 'application/json' }
                    })
                    .then(response => {
                        if (response.ok) {
                            form.reset();
                            alert(lang === 'en' ? translations.en.contact.success : translations.ar.contact.success);
                        } else {
                            // If formspree rejects it (e.g. limit reached), fallback to mailto seamlessly
                            triggerMailto();
                        }
                    })
                    .catch(() => {
                        // If network fails or CORS blocked, fallback to mailto seamlessly
                        triggerMailto();
                    })
                    .finally(() => {
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                    });
                });
            }
        });
    </script>
</body>
</html>
