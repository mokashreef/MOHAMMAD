<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Mohammad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.32/dist/lenis.min.js"></script>
</head>
<body>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <header class="header" id="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">M.</a>
            <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="ph ph-list"></i></button>
            <nav class="nav-links" id="nav-links">
                <a href="index.html" data-i18n="nav.home">Home</a>
                <a href="services.html" data-i18n="nav.services">Services</a>
                <a href="portfolio.html" data-i18n="nav.portfolio" style="color:var(--primary)">Portfolio</a>
                <a href="about.html" data-i18n="nav.about">About</a>
                <a href="contact.html" data-i18n="nav.contact">Contact</a>
                <a href="where-to-find-me.html" data-i18n="nav.findMe">Where to Find Me</a>
            </nav>
            <div class="nav-controls">
                <button id="theme-toggle" class="icon-btn"><i class="ph ph-moon"></i></button>
                <button class="icon-btn lang-switch">AR</button>
            </div>
        </div>
    </header>

    <section class="section pt-150">
        <div class="bg-gradient-1" style="top:20%"></div>
        <div class="container">
            <div class="section-header text-center gsap-reveal" style="align-items:center; text-align:center;">
                <h1 class="title-lg"><span data-i18n="portfolio.title">My </span><span style="color:var(--primary)" data-i18n="portfolio.titleSpan">Portfolio</span></h1>
                <p data-i18n="portfolio.subtitle">Explore some of my recent work</p>
            </div>

            <!-- Filters -->
            <div class="filters-container gsap-reveal" id="filters-container">
                <!-- Populated by JS -->
            </div>

            <!-- Grid -->
            <div class="portfolio-grid grid-3" id="portfolio-grid">
                <!-- Populated by JS -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p data-i18n="footer.rights">All Rights Reserved © 2025 Mohammad Abu Khashrif - Code Evolution</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/translations.js?v=2"></script>
    <script src="js/i18n.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Render Filters
            const filtersContainer = document.getElementById('filters-container');
            if (filtersContainer && typeof categoriesData !== 'undefined') {
                const lang = localStorage.getItem('lang') || 'en';
                categoriesData.forEach((cat, index) => {
                    const btn = document.createElement('button');
                    btn.className = `filter-btn ${index === 0 ? 'active' : ''}`;
                    btn.setAttribute('data-filter', cat.id);
                    btn.textContent = lang === 'en' ? cat.nameEn : cat.nameAr;
                    
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        const filterVal = btn.getAttribute('data-filter');
                        const items = document.querySelectorAll('.portfolio-card');
                        
                        items.forEach(item => {
                            if (filterVal === 'all' || item.classList.contains(filterVal)) {
                                item.style.display = 'block';
                                gsap.fromTo(item, {opacity:0, scale:0.9}, {opacity:1, scale:1, duration:0.4});
                            } else {
                                item.style.display = 'none';
                            }
                        });
                        ScrollTrigger.refresh();
                    });
                    
                    filtersContainer.appendChild(btn);
                });
            }

            // Listen to language change to re-render portfolio data properly
            document.addEventListener('languageChanged', (e) => {
                if (typeof renderPortfolio === 'function') {
                    renderPortfolio(portfolioData);
                    // Reset filters
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        const filterVal = b.getAttribute('data-filter');
                        const cat = categoriesData.find(c => c.id === filterVal);
                        b.textContent = e.detail.lang === 'en' ? cat.nameEn : cat.nameAr;
                        if(filterVal === 'all') b.click();
                    });
                }
            });
        });
    </script>
</body>
</html>
