<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الصور | لوحة التحكم</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>⚡ محمد CMS</h2>
                <span>نظام إدارة المحتوى</span>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html"><span class="nav-icon">📊</span> الرئيسية</a>
                <a href="projects.html"><span class="nav-icon">📁</span> المشاريع</a>
                <a href="categories.html"><span class="nav-icon">🏷️</span> التصنيفات</a>
                <a href="sections.html"><span class="nav-icon">📝</span> أقسام الموقع</a>
                <a href="media.html" class="active"><span class="nav-icon">🖼️</span> الصور</a>
            </nav>
            <div class="sidebar-footer">
                <a href="/" target="_blank" class="visit-site">🌐 زيارة الموقع</a>
                <button class="logout-btn" onclick="logout()">🚪 تسجيل الخروج</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="main-header">
                <h1>🖼️ إدارة الصور</h1>
                <button class="mobile-menu-toggle" onclick="toggleSidebar()">☰</button>
            </div>

            <!-- Upload Zone -->
            <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
                <div class="upload-icon">📤</div>
                <p>اسحب الصور هنا أو اضغط للرفع</p>
                <p class="upload-hint">JPG, PNG, GIF, WebP, SVG — الحد الأقصى 10MB</p>
                <input type="file" id="file-input" accept="image/*" multiple style="display:none">
            </div>

            <!-- Upload Progress -->
            <div id="upload-progress" style="display:none; margin-bottom:20px;">
                <div style="background:var(--admin-card);border:1px solid var(--admin-border);border-radius:var(--admin-radius);padding:15px;">
                    <p style="margin-bottom:8px;">⏳ جاري الرفع...</p>
                    <div style="background:var(--admin-input-bg);border-radius:10px;height:8px;overflow:hidden;">
                        <div id="progress-bar" style="background:var(--admin-primary);height:100%;width:0%;transition:width 0.3s;border-radius:10px;"></div>
                    </div>
                </div>
            </div>

            <!-- Media Grid -->
            <div class="media-grid" id="media-grid"></div>
        </main>
    </div>

    <script src="js/admin.js"></script>
    <script>
        checkAuth();
        loadMedia();

        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');

        // File input change
        fileInput.addEventListener('change', (e) => {
            uploadFiles(e.target.files);
        });

        // Drag & Drop
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            uploadFiles(e.dataTransfer.files);
        });

        async function uploadFiles(files) {
            const progress = document.getElementById('upload-progress');
            const bar = document.getElementById('progress-bar');
            progress.style.display = 'block';

            for (let i = 0; i < files.length; i++) {
                bar.style.width = `${((i + 1) / files.length) * 100}%`;

                const formData = new FormData();
                formData.append('image', files[i]);

                try {
                    const token = localStorage.getItem('token');
                    const res = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    if (!res.ok) throw new Error('فشل الرفع');
                } catch (err) {
                    showToast(`خطأ في رفع ${files[i].name}`, 'error');
                }
            }

            progress.style.display = 'none';
            bar.style.width = '0%';
            fileInput.value = '';
            showToast('تم رفع الصور بنجاح');
            loadMedia();
        }

        async function loadMedia() {
            const images = await apiGet('/api/uploads');
            const grid = document.getElementById('media-grid');

            if (images.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">🖼️</div><p>لا توجد صور مرفوعة بعد</p></div>';
                return;
            }

            grid.innerHTML = images.map(img => `
                <div class="media-item">
                    <img src="${img.path}" alt="${img.filename}" loading="lazy">
                    <div class="media-item-actions">
                        <button class="copy-link-btn" onclick="copyLink('${img.path}')">📋 نسخ</button>
                        <button class="delete-media-btn" onclick="deleteMedia('${img.filename}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function copyLink(path) {
            navigator.clipboard.writeText(path).then(() => {
                showToast('تم نسخ الرابط');
            }).catch(() => {
                // Fallback
                const input = document.createElement('input');
                input.value = path;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('تم نسخ الرابط');
            });
        }

        async function deleteMedia(filename) {
            if (!confirm('هل أنت متأكد من حذف هذه الصورة؟')) return;
            try {
                await apiDelete(`/api/upload/${filename}`);
                showToast('تم حذف الصورة');
                loadMedia();
            } catch (err) {
                showToast('حدث خطأ في الحذف', 'error');
            }
        }
    </script>
</body>
</html>
